name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m py_compile extsort.py
      - name: Smoke
        run: |
          tmp="$(mktemp -d)"
          printf 'hello\n' > "${tmp}/notes.txt"
          python extsort.py "${tmp}"
